services:
  antigravity:
    image: ghcr.io/jonnydb/antigravity:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: antigravity
    security_opt:
      - seccomp:unconfined # Required for Chrome/Electron sandboxing
    shm_size: "1gb"        # Essential for Electron / KasmVNC rendering performance
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/New_York}
      - TITLE=${TITLE:-Google Antigravity 2.0}
      # Optional: Pin a specific version of Antigravity Desktop
      - ANTIGRAVITY_VERSION=${ANTIGRAVITY_VERSION:-2.10.0-4996573600546816}
      # Optional: Auto-update on container start (true/false)
      - AUTO_UPDATE=${AUTO_UPDATE:-false}
      # Optional: HTTP Basic Authentication for web access
      # - CUSTOM_USER=${CUSTOM_USER}
      # - PASSWORD=${PASSWORD}
      # Optional: Sudo password for 'abc' user
      # - SUDO_PASSWORD=${SUDO_PASSWORD}
      # Optional: Pre-seed OAuth token
      # - ANTIGRAVITY_OAUTH_TOKEN=${ANTIGRAVITY_OAUTH_TOKEN}
    volumes:
      - ./config:/config
      - ./workspace:/config/workspace
    ports:
      - "3000:3000"   # Web Desktop GUI (HTTP)
      - "3001:3001"   # Web Desktop GUI (HTTPS - recommended for clipboard)
      - "4400:4400"   # Antigravity Hub Port
    restart: unless-stopped
